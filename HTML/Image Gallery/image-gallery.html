<!DOCTYPE html>
<html lang="en">
<head>
  <title>3*3 Image Gallery</title>
  <style>
    body{
      text-align: center;
      background-color: aliceblue;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .gallery{
      width: 90%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .gallery img{
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .gallery img:hover{
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="gallery">
    <img src="1.jpg" alt="photo">
    <img src="2.jpg" alt="photo">
    <img src="3.jpg" alt="photo">
    <img src="4.jpg" alt="photo">
    <img src="5.jpg" alt="photo">
    <img src="6.jpg" alt="photo">
    <img src="7.jpg" alt="photo">
    <img src="8.jpg" alt="photo">
    <img src="9.jpg" alt="photo">
  </div>
</body>
</html>
